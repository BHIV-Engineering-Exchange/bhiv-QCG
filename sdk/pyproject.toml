[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tantra-platform-sdk"
version = "1.0.0"
description = "Official Platform Capability SDK for the TANTRA Secure Federated Capability Fabric"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Kanishk", email = "kanishk@bhiv.dev"},
]
keywords = ["tantra", "platform", "sdk", "federation", "capability"]

dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
