[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*Suite TestEvaluation*
python_functions = test_*
addopts = -v --ignore=code_packets --ignore=DEP --ignore=review_packets --ignore=review_packet --ignore=evidence_packet --ignore=test_out.txt --ignore=tests/test_photonics_rf_systems.py
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
